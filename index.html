// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SB_URL_LS = "grizzly_sb_url";
const SB_KEY_LS = "grizzly_sb_anon";

function getSbCreds() {
  return { url: localStorage.getItem(SB_URL_LS)||"", key: localStorage.getItem(SB_KEY_LS)||"" };
}

async function sbGet(table, params={}) {
  const {url,key} = getSbCreds(); if(!url||!key) return null;
  const base = {select:"*",...params};
  const qs = Object.entries(base).map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join("&");
  try {
    const r = await fetch(`${url}/rest/v1/${table}?${qs}`,{headers:{apikey:key,Authorization:`Bearer ${key}`}});
    return r.ok ? r.json() : null;
  } catch { return null; }
}

async function sbUpdate(table, matchObj, updates) {
  const {url,key} = getSbCreds(); if(!url||!key) return false;
  const qs = Object.entries(matchObj).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join("&");
  try {
    const r = await fetch(`${url}/rest/v1/${table}?${qs}`,{
      method:"PATCH",
      headers:{apikey:key,Authorization:`Bearer ${key}`,"Content-Type":"application/json",Prefer:"return=minimal"},
      body:JSON.stringify(updates)
    });
    return r.ok;
  } catch { return false; }
}

async function loadSettings() {
  const rows = await sbGet("settings",{select:"chiave,valore"});

  if(m.phantom_dipendenti)     PHANTOM.dipendenti    = m.phantom_dipendenti;
  if(m.phantom_email)          PHANTOM.email         = m.phantom_email;
  return m;
}

async function saveSetting(chiave, valore) {
  const {url,key} = getSbCreds(); if(!url||!key) return false;
  try {
    const r = await fetch(`${url}/rest/v1/settings?on_conflict=chiave`, {
      method: "POST",
      headers: {
        apikey: key, Authorization: `Bearer ${key}`,
        "Content-Type": "application/json",
        Prefer: "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify({chiave, valore, aggiornato_il: new Date().toISOString()})
    });
    return r.ok;
  } catch { return false; }
}

async function sbWritePipelineState(fase, stato, dettaglio) {
  const {url, key} = getSbCreds(); if(!url||!key) return;
  try {
    await fetch(`${url}/rest/v1/pipeline_state`, {
      method: "POST",
      headers: {apikey:key, Authorization:`Bearer ${key}`, "Content-Type":"application/json", Prefer:"resolution=merge-duplicates"},
      body: JSON.stringify({fase, stato, dettaglio, aggiornato_il: new Date().toISOString()})
    });
  } catch(e) {}
}

async function sbInsert(table, records) {
  const {url,key} = getSbCreds(); if(!url||!key||!records.length) return false;
  try {
    const r = await fetch(`${url}/rest/v1/${table}`,{
      method:"POST",
      headers:{apikey:key,Authorization:`Bearer ${key}`,"Content-Type":"application/json",Prefer:"return=minimal"},
      body:JSON.stringify(records)
    });
    if(!r.ok) {
      const body = await r.text().catch(()=>"(no body)");
      console.error(`sbInsert [${table}] HTTP ${r.status}:`, body);
      return false;
    }
    return true;
  } catch(e) { console.error(`sbInsert [${table}] exception:`, e); return false; }
}

// Dedup: controlla quali siti/pive sono già in Supabase
// Ritorna {sitiFnd: Set<string normalizzato>, piveFnd: Set<string>}
function normSito(s){ return (s||"").toLowerCase().trim().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"").split("/")[0]; }

async function checkDedup(sitiArr, pivaArr) {
  const {url,key} = getSbCreds();
  const out = {sitiFnd: new Set(), piveFnd: new Set()};
  if(!url||!key) return out;
  const siti = [...new Set(sitiArr.filter(Boolean).map(normSito))];
  const pive = [...new Set(pivaArr.filter(Boolean).map(p=>String(p).trim()))];
  try {
    if(siti.length){
      const orFilter = siti.map(s=>`sito_web.ilike.*${s}*`).join(',');
      const r = await fetch(`${url}/rest/v1/companies?select=sito_web&or=(${orFilter})`,
        {headers:{apikey:key,Authorization:`Bearer ${key}`}});
      if(r.ok)(await r.json()).forEach(row=>out.sitiFnd.add(normSito(row.sito_web)));
    }
    if(pive.length){
      const r = await fetch(`${url}/rest/v1/companies?select=partita_iva&partita_iva=in.(${pive.join(",")})`,
        {headers:{apikey:key,Authorization:`Bearer ${key}`}});
      if(r.ok)(await r.json()).forEach(row=>out.piveFnd.add(String(row.partita_iva).trim()));
    }
  } catch {}
  return out;
}

    <div className="hovrow" style={{display:"flex",alignItems:"center",gap:10,padding:"9px 16px",borderBottom:"1px solid #1e2a3a"}}>

      {!dirty&&!val&&<span style={{fontSize:9,color:C2.muted}}>vuoto</span>}
    </div>
  );
};

const EB_TARGET = ["Social Media","Ragione sociale","Partita IVA","Indirizzo 1","CAP","Città","Regione/provincia","Regione","E-mail","PEC","Sito web","Numero dipendenti per fascia","ATECO code (IT 2007)","ATECO description (IT 2007)","Data di creazione","Fatturato lordo","Classe di rischio"];
const EB_ALIASES = {"email":"E-mail","e-mail":"E-mail","pec email":"PEC","p.e.c.":"PEC","sito":"Sito web","sito web":"Sito web","ragione sociale":"Ragione sociale","partita iva":"Partita IVA","indirizzo":"Indirizzo 1","cap":"CAP","citta":"Città","regione/provincia":"Regione/provincia","regione":"Regione","numero dipendenti per fascia":"Numero dipendenti per fascia","ateco code (it 2007)":"ATECO code (IT 2007)","ateco  description  (it 2007)":"ATECO description (IT 2007)","ateco description (it 2007)":"ATECO description (IT 2007)","data di creazione":"Data di creazione","fatturato lordo":"Fatturato lordo","classe di rischio":"Classe di rischio","social media":"Social Media","email nominative dirigenti*":"Social Media"};
function ebNorm(s){return(s||'').trim().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');}
async function processEasybusinessFile(file){
  const buf = await file.arrayBuffer();
  const wb  = XLSX.read(buf,{type:'array'});
  const ws  = wb.Sheets[wb.SheetNames[0]];
  const rawAll = XLSX.utils.sheet_to_json(ws,{defval:''});
  // Filtra righe completamente vuote — controlla solo le colonne target (ignora __EMPTY ecc.)
  const raw = rawAll.filter(row => {
    const vals = Object.entries(row).filter(([k])=>!k.startsWith('__')).map(([,v])=>String(v).trim());
    return vals.some(v=>v!=='');
  });
  if(!raw.length) throw new Error('File vuoto');
  // DEBUG: log foglio e conteggi
  const dbg = `Sheet: ${wb.SheetNames[0]} | Tutte righe: ${rawAll.length} | Dopo filtro: ${raw.length} | Colonne: ${Object.keys(rawAll[0]||{}).join(', ').slice(0,80)}`;
  console.log('[EB DEBUG]', dbg);
  const targetByNorm = Object.fromEntries(EB_TARGET.map(t=>[ebNorm(t),t]));
  const mapping = {};
  for(const col of Object.keys(raw[0])){
    const nc=ebNorm(col);
    if(targetByNorm[nc]){mapping[col]=targetByNorm[nc];}
    else if(EB_ALIASES[nc]){mapping[col]=EB_ALIASES[nc];}
  }
  const n=raw.length;
  const output=raw.map((row,i)=>{
    const out={};
    EB_TARGET.forEach(t=>out[t]='');
    for(const[src,tgt]of Object.entries(mapping))out[tgt]=row[src]??'';
    out['__row_n']=i+1; out['__row_total']=n;
    return out;
  });
  const ws2=XLSX.utils.json_to_sheet(output,{header:[...EB_TARGET,'__row_n','__row_total']});
  const csv='﻿'+XLSX.utils.sheet_to_csv(ws2);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  return {blob, rowCount:n, mappedCols:Object.keys(mapping).length, rows:output};
}

// ── LEGGI STATO DA GOOGLE SHEET ───────────────────────────────────────────────
function parseSheetData(raw) {
  try {
    const json = JSON.parse(raw.replace(/^[^(]+\(/, "").replace(/\);?$/, ""));
    const rows = json.table.rows;
    if (!rows || rows.length === 0) return null;
    const get = (cells, i) => cells[i]?.v ?? "";
    // Leggi tutte le righe e prendi l'ultima per ogni fase
    const byFase = {};
    for (const row of rows) {
      const cells = row.c || [];
      const fase = get(cells, 2);
      if (fase) byFase[fase] = {
        run_id:        get(cells, 0),
        campagna:      get(cells, 1),
        fase,
        stato:         get(cells, 3),
        dettaglio:     get(cells, 4),
        timestamp:     get(cells, 5),
        aziende_tot:   get(cells, 6),
        url_pendenti:  get(cells, 7),
        errori_aperti: get(cells, 8),
        leads_lemlist: get(cells, 9),
      };
    }
    // Ultima riga per run_id e campagna globali
    const last = rows[rows.length - 1];
    const lc = last.c || [];
    return {
      run_id:    get(lc, 0),
      campagna:  get(lc, 1),
      byFase,
      leads_lemlist: get(lc, 9),
    };
  } catch(e) { return null; }
}

  const fetchUrlSheet = useCallback(async () => {
    try {
      const url = `https://docs.google.com/spreadsheets/d/${URL_SHEET_ID}/gviz/tq?tqx=out:json&headers=1&t=${Date.now()}`;
      const res = await fetch(url);
      const raw = await res.text();
      const json = JSON.parse(raw.replace(/^[^(]+\(/, "").replace(/\);?$/, ""));
      const rows = json.table.rows;
      const cols = json.table.cols.map(c => c.label || "");
      if (!rows || rows.length === 0) return;
      const get = (cells, i) => cells[i]?.v ?? "";
      // Mappa indici colonne — struttura esatta: Title_Phantom | Ragione sociale | LinkedinURL_Phantom | LinkedinURL_Easybusiness | LinkiedinURL_da_ricercare | Sito web
      const iRs   = cols.findIndex(c => c.toLowerCase().includes("ragione"));
      const iSito = cols.findIndex(c => c.toLowerCase().includes("sito"));
      const iPh   = cols.findIndex(c => /linkedinurl_phantom/i.test(c));
      const iEb   = cols.findIndex(c => /linkedinurl_easy/i.test(c));
      const iCit  = cols.findIndex(c => c.toLowerCase().includes("citt"));
      const iFat  = cols.findIndex(c => c.toLowerCase().includes("fatturato"));
      const iResult = 4; // col E — "URL Da Verificare" = da fare
      const iMatch  = 22; // col W — "best match" = già verificato
      const allRows = rows.map((row, i) => {
        const c = row.c || [];
        return {
          id: i + 1,
          ragione_sociale: get(c, iRs),
          sito:            iSito >= 0 ? get(c, iSito) : "",
          url_phantom:     iPh   >= 0 ? get(c, iPh)   : "",
          url_easybusiness:iEb   >= 0 ? get(c, iEb)   : "",
          citta:           iCit  >= 0 ? get(c, iCit)  : "",
          fatturato:       iFat  >= 0 ? get(c, iFat)  : "",
          stato:           "pending",
          url_scelto:      get(c, iResult),
          match_type:      get(c, iMatch),
          _raw:            c, // conserva raw per il check col E
        };
      }).filter(r => r.ragione_sociale && !/^ragione.?sociale$/i.test(r.ragione_sociale.trim()));

      // Verifica che Make.com abbia finito — due controlli:
      // 1. Il foglio URL deve avere almeno tante righe quante le aziende con company page trovata
      const expectedRows = azOutputRef.current || 0;
      if (expectedRows > 0 && allRows.length < expectedRows) {
        pushLog("info", `⏳ Foglio URL in attesa righe (${allRows.length}/${expectedRows})...`);
        return;
      }
      // 2. Tutte le righe devono avere col E valorizzata (agente ha finito)
      const totaleRighe = allRows.length;
      const righeConColE = allRows.filter(r => (r.url_scelto || '').trim() !== '').length;
      if (totaleRighe > 0 && righeConColE < totaleRighe) {
        pushLog("info", `⏳ Foglio URL in elaborazione (${righeConColE}/${totaleRighe} processate)...`);
        return;
      }

      const parsed = allRows
        .filter(r => !/best.?match/i.test(r.match_type))
        .filter(r => /url\s*da\s*verificare/i.test(r.url_scelto));

      // Sempre aggiorna urls e segnala il completamento del fetch
      setUrls(parsed);
      setUrlCheckReady(true);
      if (parsed.length > 0) {
        pushLog("info", `URL da valutare: ${parsed.length} da verificare`);
      } else {
        // Controlla se HubSpot è già stato inviato prima di procedere
        const hubspotKey = `grizzly_hubspot_fired_${runId}`;
        if (runId && localStorage.getItem(hubspotKey)) return;
        pushLog("ok", "✓ Nessun URL da verificare — procedo automaticamente ad HubSpot");
        setAutoProceedUrl(true);
      }
    } catch(e) {
      // fallback silenzioso — usa i dati statici
    }
  }, []);

            const sito = (codeSitoEdit[companyId]||"").trim();
            if(!sito) return;
            const ok = await sbUpdate("companies",{id:companyId},{sito_web:sito, stato:"nuovo", aggiornato_il:new Date().toISOString()});
            if(ok){
              setCodeQueue(q=>({...q, siti:q.siti.filter(c=>c.id!==companyId)}));
              setCodeSitoEdit(e=>{const n={...e};delete n[companyId];return n;});
            }

              setCodeQueue(q=>({...q, urlAmbigue:q.urlAmbigue.filter(c=>c.id!==companyId)}));

                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden",marginBottom:16}}>
                  <QueueHeader icon="🌐" title="Siti web mancanti" count={codeQueue.siti.length} color={C.yellow}/>
                  <div style={{fontSize:11,color:C.muted,padding:"8px 20px 0",lineHeight:1.5}}>
                    Aziende senza sito web — inserisci l'URL e salva per reinserirle in pipeline
                  </div>
                  {codeQueue.siti.map(az=>(
                    <div key={az.id} className="hovrow" style={{display:"flex",alignItems:"center",gap:12,padding:"12px 20px",borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
                      <div style={{flex:"0 0 240px"}}>
                        <div style={{fontSize:12,fontWeight:600,color:C.textHi,marginBottom:2}}>{az.nome}</div>
                        <div style={{fontSize:10,color:C.muted}}>{az.citta||"—"}{az.partita_iva?` · P.IVA ${az.partita_iva}`:""}</div>
                      </div>
                      <input
                        type="text"
                        placeholder="https://www.azienda.it"
                        value={codeSitoEdit[az.id]||""}
                        onChange={e=>setCodeSitoEdit(s=>({...s,[az.id]:e.target.value}))}
                        style={{flex:1,minWidth:200,background:C.bg,border:`1px solid ${codeSitoEdit[az.id]?C.accent:C.border}`,borderRadius:3,padding:"5px 10px",fontSize:11,color:C.text,fontFamily:"'JetBrains Mono',monospace"}}
                      />
                      <Btn color={C.green} bg={C.greenDim} border="rgba(34,197,94,.4)" small disabled={!codeSitoEdit[az.id]} onClick={()=>salvaSito(az.id)}>Salva</Btn>
                    </div>
                  ))}
                </div>
              )}

              {/* ── URL AMBIGUE ── */}
              {sbReady&&codeQueue.urlAmbigue.length>0&&(
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden",marginBottom:16}}>
                  <QueueHeader icon="🔗" title="URL LinkedIn ambigue" count={codeQueue.urlAmbigue.length} color={C.orange}/>
                  <div style={{fontSize:11,color:C.muted,padding:"8px 20px 0",lineHeight:1.5}}>
                    Company page LinkedIn da verificare — incolla o correggi l'URL e conferma
                  </div>
                  {codeQueue.urlAmbigue.map(az=>(
                    <div key={az.id} className="hovrow" style={{display:"flex",alignItems:"center",gap:12,padding:"12px 20px",borderTop:`1px solid ${C.border}`,flexWrap:"wrap"}}>
                      <div style={{flex:"0 0 220px"}}>
                        <div style={{fontSize:12,fontWeight:600,color:C.textHi,marginBottom:2}}>{az.nome}</div>
                        <div style={{fontSize:10,color:C.muted}}>{az.citta||"—"}</div>
                        {az.sito_web&&<a href={/^https?:\/\//i.test(az.sito_web)?az.sito_web:"https://"+az.sito_web} target="_blank" style={{fontSize:10,color:C.accent}}>{az.sito_web}</a>}
                      </div>
                      <input
                        type="text"
                        placeholder="https://www.linkedin.com/company/..."
                        value={codeUrlEdit[az.id]!==undefined ? codeUrlEdit[az.id] : (az.linkedin_url||"")}
                        onChange={e=>setCodeUrlEdit(s=>({...s,[az.id]:e.target.value}))}
                        style={{flex:1,minWidth:220,background:C.bg,border:`1px solid ${codeUrlEdit[az.id]!==undefined&&codeUrlEdit[az.id]!==(az.linkedin_url||"")?C.accent:C.border}`,borderRadius:3,padding:"5px 10px",fontSize:11,color:C.text,fontFamily:"'JetBrains Mono',monospace"}}
                      />
                      {(codeUrlEdit[az.id]!==undefined?codeUrlEdit[az.id]:az.linkedin_url)&&(
                        <a href={codeUrlEdit[az.id]||az.linkedin_url} target="_blank" style={{fontSize:10,color:C.muted,whiteSpace:"nowrap"}}>↗ Apri</a>
                      )}
                      <Btn color={C.green} bg={C.greenDim} border="rgba(34,197,94,.4)" small
                        disabled={!(codeUrlEdit[az.id]!==undefined?codeUrlEdit[az.id]:az.linkedin_url)}
                        onClick={()=>{
                          const url = codeUrlEdit[az.id]!==undefined ? codeUrlEdit[az.id] : (az.linkedin_url||"");
                          approvaUrl(az.id, url);
                        }}>✓ Conferma</Btn>
                    </div>
                  ))}
                </div>
              )}

              {/* ── CONTATTI DA APPROVARE ── */}
              {sbReady&&codeQueue.contatti.length>0&&(
                <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:6,overflow:"hidden",marginBottom:16}}>
                  <QueueHeader icon="👤" title="Contatti da approvare" count={codeQueue.contatti.length} color={C.purple}/>
                  <div style={{fontSize:11,color:C.muted,padding:"8px 20px 0",lineHeight:1.5}}>
                    Trovati dall'estensione — approva per inviarli in pipeline, scarta per ignorarli
                  </div>
                  {/* Header colonne */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 160px 80px",gap:12,padding:"8px 20px",borderTop:`1px solid ${C.border}`,fontSize:9,fontWeight:700,letterSpacing:"0.08em",color:C.muted,textTransform:"uppercase"}}>
                    <span>Contatto</span><span>Azienda</span><span>LinkedIn</span><span style={{textAlign:"right"}}>Azione</span>
                  </div>
                  {codeQueue.contatti.map(ct=>{
                    const nomeCompleto = ct.nome_completo || [ct.nome,ct.cognome].filter(Boolean).join(" ") || "—";
                    const azienda = ct.azienda_nome || ct.companies?.nome || (ct.company_id ? `ID ${ct.company_id}` : "—");
                    return (
                      <div key={ct.id} className="hovrow" style={{display:"grid",gridTemplateColumns:"1fr 1fr 160px 80px",gap:12,padding:"10px 20px",borderTop:`1px solid ${C.border}`,alignItems:"center"}}>
                        <div>
                          <div style={{fontSize:12,fontWeight:600,color:C.textHi}}>{nomeCompleto}</div>
                          {ct.ruolo&&<div style={{fontSize:10,color:C.muted,marginTop:1}}>{ct.ruolo}</div>}
                        </div>
                        <div style={{fontSize:11,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{azienda}</div>
                        <div style={{overflow:"hidden"}}>
                          {ct.linkedin_url
                            ?<a href={ct.linkedin_url} target="_blank" style={{fontSize:10,color:C.accent,display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={ct.linkedin_url}>↗ Profilo LinkedIn</a>
                            :<span style={{fontSize:10,color:C.muted}}>—</span>}
                        </div>
                        <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                          <button onClick={()=>gestisciContatto(ct.id,true)} title="Approva" style={{width:28,height:28,borderRadius:4,background:C.greenDim,border:`1px solid ${C.green}44`,color:C.green,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✓</button>
                          <button onClick={()=>gestisciContatto(ct.id,false)} title="Scarta" style={{width:28,height:28,borderRadius:4,background:C.redDim,border:`1px solid ${C.red}44`,color:C.red,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                        </div>
                      </div>
                    );
                  })}
                  {/* Approva / Scarta tutti */}
                  <div style={{padding:"12px 20px",borderTop:`1px solid ${C.border}`,display:"flex",gap:8,justifyContent:"flex-end"}}>
                    <Btn color={C.green} bg={C.greenDim} border="rgba(34,197,94,.4)" small
                      onClick={async()=>{
                        for(const ct of [...codeQueue.contatti]) await gestisciContatto(ct.id,true);
                      }}>✓ Approva tutti</Btn>
                    <Btn color={C.red} bg={C.redDim} border="rgba(239,68,68,.4)" small
                      onClick={async()=>{
                        if(!await customConfirm(`Scartare tutti i ${codeQueue.contatti.length} contatti in coda?`)) return;
                        for(const ct of [...codeQueue.contatti]) await gestisciContatto(ct.id,false);
                      }}>✕ Scarta tutti</Btn>
                  </div>
                </div>
              )}
            </div>
          );
        })()}

      </div>

      {toast&&(
        <div style={{position:"fixed",bottom:20,right:20,zIndex:999,background:C.surfaceHi,border:`1px solid ${C.borderHi}`,borderLeft:`3px solid ${toast.color}`,borderRadius:6,padding:"11px 16px",fontSize:12,color:C.textHi,animation:"slideUp .2s ease",boxShadow:"0 8px 32px rgba(0,0,0,.5)"}}>
          {toast.msg}
        </div>
      )}
    </div>

      {showReviewTool&&(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,zIndex:1000,background:"rgba(0,0,0,0.85)",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",background:"#0d1117",borderBottom:"1px solid rgba(255,255,255,0.1)",flexShrink:0}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:14}}>🔍</span>
              <span style={{fontSize:13,fontWeight:700,color:"#f1f5f9"}}>Rivedi URL ambigui</span>
              <span style={{fontSize:11,color:"#4a6080",background:"rgba(255,255,255,0.05)",padding:"2px 8px",borderRadius:10,border:"1px solid rgba(255,255,255,0.08)"}}>Prospecting output</span>
            </div>
            <button onClick={()=>setShowReviewTool(false)} style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.3)",color:"#f87171",borderRadius:6,padding:"5px 14px",fontSize:12,fontWeight:600,cursor:"pointer"}}>✕ Chiudi</button>
          </div>
          {reviewBlobUrl&&<iframe src={reviewBlobUrl} style={{flex:1,border:"none",width:"100%"}} sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation"
            onLoad={e=>{
              const {url:sbUrl, key:sbKey} = getSbCreds();
              e.target.contentWindow?.postMessage({action:'sbCreds', url:sbUrl, key:sbKey},'*');
              if(reviewDebugMode) e.target.contentWindow?.postMessage({action:'debugMode'},'*');
            }}/>}
        </div>
      )}

      {/* ── CONFIRM MODAL ── */}
      {confirmModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999}}
          onClick={()=>{confirmModal.resolve(false);setConfirmModal(null);}}>
          <div style={{background:"#1e2a3a",border:`1px solid ${C.border}`,borderRadius:10,padding:"28px 32px",minWidth:320,maxWidth:420,boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}
            onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:14,color:C.text,marginBottom:24,lineHeight:1.5}}>{confirmModal.msg}</div>
            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>{confirmModal.resolve(false);setConfirmModal(null);}}
                style={{padding:"8px 20px",fontSize:12,fontWeight:600,color:C.muted,background:"transparent",border:`1px solid ${C.border}`,borderRadius:6,cursor:"pointer"}}>
                Annulla
              </button>
              <button onClick={()=>{confirmModal.resolve(true);setConfirmModal(null);}}
                style={{padding:"8px 20px",fontSize:12,fontWeight:700,color:"#fff",background:"linear-gradient(135deg,#dc2626,#ef4444)",border:"none",borderRadius:6,cursor:"pointer"}}>
                Ok
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
